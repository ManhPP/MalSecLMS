services:
  dozzle:
    image: amir20/dozzle:latest
    container_name: malsec-dozzle
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./monitoring/data:/data
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    environment:
      TZ: "Asia/Ho_Chi_Minh"
      DOZZLE_AUTH_PROVIDER: "simple"
      DOZZLE_NO_ANALYTICS: "true"
      DOZZLE_LEVEL: "info"
    networks:
      - monitoring-network

  loki:
    image: grafana/loki:3.1.0
    container_name: malsec-loki
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3100"
    command: -config.file=/etc/loki/loki-config.yaml
    environment:
      TZ: "Asia/Ho_Chi_Minh"
    volumes:
      - ./monitoring/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - ./monitoring/loki/data:/loki
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    networks:
      - monitoring-network

  promtail:
    image: grafana/promtail:3.1.0
    container_name: malsec-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yaml
    environment:
      TZ: "Asia/Ho_Chi_Minh"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./monitoring/promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    depends_on:
      - loki
    networks:
      - monitoring-network

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: malsec-cadvisor
    restart: unless-stopped
    privileged: true
    environment:
      TZ: "Asia/Ho_Chi_Minh"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    devices:
      - /dev/kmsg
    networks:
      - monitoring-network

  prometheus:
    image: prom/prometheus:latest
    container_name: malsec-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
    environment:
      TZ: "Asia/Ho_Chi_Minh"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/data:/prometheus
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    depends_on:
      - cadvisor
      - pve-exporter
    networks:
      - monitoring-network

  pve-exporter:
    image: prompve/prometheus-pve-exporter:latest
    container_name: malsec-pve-exporter
    restart: unless-stopped
    environment:
      TZ: "Asia/Ho_Chi_Minh"
    volumes:
      - ./monitoring/pve/pve.yml:/etc/prometheus/pve.yml:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    networks:
      - monitoring-network

  grafana:
    image: grafana/grafana:11.5.2
    container_name: malsec-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=KhongQuanLieu
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_DATE_FORMATS_DEFAULT_TIMEZONE=Asia/Ho_Chi_Minh
      - TZ=Asia/Ho_Chi_Minh
    volumes:
      - ./monitoring/grafana/data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    depends_on:
      - loki
      - prometheus
    networks:
      - monitoring-network

networks:
  monitoring-network:
    driver: bridge
