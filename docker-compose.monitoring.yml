services:
  dozzle:
    image: amir20/dozzle:latest
    container_name: malsec-dozzle
    restart: unless-stopped
    ports:
      - "8888:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./monitoring/data:/data
    environment:
      DOZZLE_AUTH_PROVIDER: "simple"
      DOZZLE_NO_ANALYTICS: "true"
      DOZZLE_LEVEL: "info"
