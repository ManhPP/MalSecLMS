version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: malsec-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-malsec_db_pass_2026}
      POSTGRES_DB: ${DB_NAME:-malsec_lms}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - malsec-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: malsec-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-malsec_db_pass_2026}@db/${DB_NAME:-malsec_lms}
      - JWT_SECRET=${JWT_SECRET:-super_secret_jwt_key_for_malsec_lms_2026_!!}
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=480
      - UPLOAD_DIR=/app/uploads
    volumes:
      - student_uploads:/app/uploads
    depends_on:
      - db
    networks:
      - malsec-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: malsec-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - malsec-network

volumes:
  postgres_data:
  student_uploads:

networks:
  malsec-network:
    driver: bridge
