global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'proxmox'
    metrics_path: /pve
    params:
      module: [default]
      target: ['10.0.80.10']
    scrape_interval: 10s
    static_configs:
      - targets: ['pve-exporter:9221']
        labels:
          node: 'pve01'
          cluster: 'proxmox-cluster'
